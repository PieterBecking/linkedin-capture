<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LinkedIn → CRM settings</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="stylesheet" href="sidepanel.css" />
  <style>
    body { max-width: 480px; margin: 32px auto; padding: 0 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    input[type="text"], input[type="password"] {
      background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 8px;
      padding: 10px; color: #f0f0f0; font-size: 14px; outline: none;
    }
    input:focus { border-color: #48484a; }
    label { font-size: 12px; color: #8e8e93; }
    .row { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <h2 style="font-weight:600; font-size:16px; margin:0 0 16px;">LinkedIn → CRM settings</h2>

  <h2 class="settings-heading">Saved replies</h2>
  <p class="meta">Suggested replies use this wording. Add <code>{firstName}</code> for the sender’s first name. You can also edit each draft in the sidebar.</p>
  <div class="field">
    <label for="recruiterTemplate">Recruiters</label>
    <textarea id="recruiterTemplate" class="notes-input" rows="4"></textarea>
  </div>
  <div class="field">
    <label for="investorTemplate">Investors</label>
    <textarea id="investorTemplate" class="notes-input" rows="5"></textarea>
  </div>
  <div class="field">
    <label for="servicesTemplate">Engineering services</label>
    <textarea id="servicesTemplate" class="notes-input" rows="4"></textarea>
  </div>
  <div class="row">
    <button id="saveRepliesBtn" class="btn primary" type="button">Save replies</button>
    <button id="resetRepliesBtn" class="btn" type="button">Restore defaults</button>
  </div>
  <p id="repliesMsg" class="meta" role="status" aria-live="polite"></p>

  <h2 class="settings-heading">CRM capture</h2>
  <div class="field">
    <label for="crmUrl">CRM base URL</label>
    <input id="crmUrl" type="text" placeholder="https://brain.servo7.com" />
  </div>

  <div class="field">
    <label for="internalToken">Internal API token <span class="meta">(maps to CRM <code>INTERNAL_API_TOKEN</code>)</span></label>
    <input id="internalToken" type="password" placeholder="paste token" autocomplete="off" />
  </div>

  <div class="row">
    <button id="saveBtn" class="btn primary">Save</button>
    <button id="testBtn" class="btn">Test connection</button>
    <span id="msg" class="meta"></span>
  </div>

  <h2 style="font-weight:600; font-size:16px; margin:32px 0 16px;">Recruitment export</h2>

  <div class="field">
    <label for="extBaseUrl">Server base URL <span class="meta">(auth is your Brain sign-in session — no token needed)</span></label>
    <input id="extBaseUrl" type="text" placeholder="https://brain.servo7.com" />
  </div>

  <div class="row">
    <button id="extSaveBtn" class="btn primary">Save</button>
    <button id="extTestBtn" class="btn">Test connection</button>
    <span id="extMsg" class="meta"></span>
  </div>

  <script src="reply-templates.js"></script>
  <script src="options.js"></script>
</body>
</html>
