<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkedIn → CRM</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="title">LinkedIn → CRM</div>
      <a href="#" id="openOptions" class="link">settings</a>
    </header>

    <section id="status" class="status hidden"></section>

    <section id="replyCard" class="card reply-card hidden" aria-labelledby="replyHeading">
      <div class="reply-heading">
        <h1 id="replyHeading">Quick reply</h1>
        <button id="readReplyBtn" class="text-button" type="button">Read again</button>
      </div>
      <div id="replyContext" class="reply-context">Reading the open conversation…</div>
      <div id="replyStatus" class="meta" role="status" aria-live="polite"></div>
      <details id="replySource" class="reply-source hidden">
        <summary>Message being answered</summary>
        <p id="replySourceText"></p>
      </details>
      <label for="replyKind" class="field-label">Reply type</label>
      <select id="replyKind" class="select-input" disabled>
        <option value="">Choose a reply type…</option>
        <option value="recruiter">Recruiter · politely decline</option>
        <option value="investor">Investor · keep in touch</option>
        <option value="services">Engineering services · politely decline</option>
      </select>
      <label for="replyDraft" class="field-label">Your reply</label>
      <textarea id="replyDraft" class="notes-input reply-draft" rows="7" placeholder="A suggested reply will appear here. You can edit it before copying." disabled></textarea>
      <div class="reply-actions">
        <button id="copyReplyBtn" class="btn reply-copy" type="button" disabled>Copy reply</button>
        <button id="resetReplyBtn" class="btn" type="button" disabled>Reset draft</button>
      </div>
      <a href="#" id="replySettings" class="link">Customize your saved replies</a>
    </section>

    <section id="captureCard" class="card">
      <button id="captureBtn" class="btn primary">Capture this thread</button>
      <div id="captureMeta" class="meta hidden"></div>
    </section>

    <section id="profileCard" class="card hidden">
      <div>
        <div id="profileName" class="profile-name"></div>
        <div id="profileHeadline" class="meta"></div>
        <div class="meta">
          <span id="scrapeSummary"></span>
          <a href="#" id="rescanLink" class="link">rescan</a>
        </div>
      </div>

      <div id="pipelineBanner" class="status warn hidden"></div>

      <label class="field-label">Role</label>
      <select id="roleSelect" class="select-input"></select>

      <label class="field-label">Stage</label>
      <select id="stageSelect" class="select-input"></select>

      <label class="field-label">Notes</label>
      <textarea
        id="candidateNotes"
        class="notes-input"
        rows="3"
        placeholder="Optional notes for the pipeline…"
      ></textarea>

      <button id="exportBtn" class="btn primary">Export to pipeline</button>
      <div id="exportResult" class="meta hidden"></div>
    </section>

    <section id="formCard" class="card hidden">
      <label class="field-label">Meeting name &middot; #company &middot; @person</label>
      <div
        id="meetingTitle"
        class="meeting-input"
        contenteditable="true"
        spellcheck="false"
        data-placeholder="LinkedIn chat with @… at #…"
      ></div>
      <div id="pills" class="pills"></div>

      <label class="field-label">Date</label>
      <input id="meetingDate" type="date" class="date-input" />

      <label class="field-label">Conversation preview</label>
      <pre id="preview" class="preview"></pre>

      <button id="saveBtn" class="btn primary">Add note to CRM</button>
      <div id="saveResult" class="meta hidden"></div>
    </section>

    <div id="suggestPopover" class="suggest-popover hidden"></div>
  </div>

  <script src="reply-templates.js"></script>
  <script src="reply-panel.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
